<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Form</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  overflow: hidden;
  animation: fadeIn 1s ease-in;
}
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

.card {
  background: rgba(255,255,255,0.95);
  width: 90%;
  max-width: 420px;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  backdrop-filter: blur(6px);
  animation: slideDown 0.8s ease-out;
}
@keyframes slideDown {
  from {transform: translateY(-50px); opacity:0;}
  to {transform: translateY(0); opacity:1;}
}

h2 { text-align:center; color:#0f2027; font-weight:600; margin-bottom:15px; }

input, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border:2px solid #2c5364;
  border-radius:8px;
  font-size:15px;
  outline:none;
  transition:0.3s;
  background: white;
}
input:focus, textarea:focus {
  border-color:#0f2027;
  transform: scale(1.02);
  box-shadow:0 0 12px rgba(44,83,100,0.5);
}

textarea { resize:none; height:70px; }

button {
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  background:#203a43;
  color:white;
  font-size:16px;
  border-radius:8px;
  opacity:0.6;
  cursor:not-allowed;
  transition:0.3s;
}
button.active {
  opacity:1;
  cursor:pointer;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from {box-shadow:0 0 8px rgba(32,58,67,0.4);}
  to {box-shadow:0 0 18px rgba(32,58,67,1);}
}
button:hover.active { background:#0f2027; transform:scale(1.04); }

</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="card">
  <h2>Register Now</h2>

  <input type="text" id="name" placeholder="Name">
  <input type="text" id="mother" placeholder="Mother's Name">
  <input type="text" id="father" placeholder="Father's Name">
  <textarea id="address" placeholder="Address"></textarea>
  <input type="text" id="mobile" placeholder="Mobile Number">
  <input type="email" id="email" placeholder="Email ID">

  <button id="submitBtn" disabled>Submit</button>
</div>

<script>
// Enable submit when all fields are filled
const inputs = document.querySelectorAll("#name, #mother, #father, #address, #mobile, #email");
const btn = document.getElementById("submitBtn");

inputs.forEach(i => i.addEventListener("input", () => {
  const filled = [...inputs].every(i => i.value.trim() !== "");
  if (filled) {
    btn.disabled = false;
    btn.classList.add("active");
  } else {
    btn.disabled = true;
    btn.classList.remove("active");
  }
}));

// Submit action
btn.addEventListener("click", () => {
  const userData = {
    Name: document.getElementById("name").value,
    Mother: document.getElementById("mother").value,
    Father: document.getElementById("father").value,
    Address: document.getElementById("address").value,
    Mobile: document.getElementById("mobile").value,
    Email: document.getElementById("email").value,
    Time: new Date().toLocaleString("en-IN", {timeZone:"+05:30"})
  };

  // Save user data for welcome page
  localStorage.setItem("lastUser", JSON.stringify(userData));

  // Confetti effect
  confetti({ particleCount: 170, spread: 85, origin: { y: 0.6 } });

  // Reset form
  inputs.forEach(i => i.value = "");
  btn.disabled = true;
  btn.classList.remove("active");

  // Redirect to welcome.html
  setTimeout(() => {
    window.location.href = "welcome.html";
  }, 1500);
});

// Heartbeat active user tracking
setInterval(() => {
  const uid = localStorage.getItem("sessionUID") || Date.now();
  localStorage.setItem("activeUser_" + uid, "1");
  localStorage.setItem("sessionUID", uid);
  setTimeout(() => localStorage.removeItem("activeUser_" + uid), 10000);
}, 4000);
</script>

</body>
</html>
